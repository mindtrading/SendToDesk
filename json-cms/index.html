<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON CMS — Cloudflare</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-mark"><span class="dot"></span><strong>JSON CMS</strong></div>
      <h1>অ্যাডমিন লগইন</h1>
      <p class="sub">R2-এর সব JSON এডিট করুন — অটো ফর্ম।</p>
      <div class="stack">
        <input id="username" class="input" name="username" placeholder="Username" required autocomplete="username" />
        <input id="password" class="input" name="password" type="password" placeholder="Password" required autocomplete="current-password" />
        <button class="btn btn-block" type="submit">Login</button>
      </div>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="side-head">
        <h2>JSON files</h2>
      </div>
      <div class="side-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="btn-new">New</button>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-refresh">Refresh</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-seed">Seed samples</button>
      </div>
      <div id="file-list" class="file-list"></div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="current-file">JSON CMS</h1>
          <span id="dirty-dot" class="dirty-dot" hidden title="Unsaved"></span>
        </div>
        <div class="topbar-actions">
          <span id="user-label" class="user-chip"></span>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-save">Save</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-delete">Delete</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-logout">Logout</button>
        </div>
      </header>

      <div class="editor">
        <div id="editor-empty" class="empty-state">
          <h2>একটা JSON সিলেক্ট করুন</h2>
          <p>বাম পাশ থেকে ফাইল খুলুন, অথবা New / Seed samples চাপুন। স্ট্যাটিক সাইট পাবলিক URL থেকে ফেচ করবে: <code>/content/your-file.json</code></p>
        </div>

        <div id="editor-panel" hidden>
          <div class="tabs">
            <button type="button" class="tab active" id="tab-form">Form</button>
            <button type="button" class="tab" id="tab-raw">Raw JSON</button>
          </div>
          <p class="public-line">Public read: <a id="public-url" href="#" target="_blank" rel="noopener">/content/…</a></p>
          <div id="form-root"></div>
          <div id="raw-root" hidden>
            <textarea id="raw-editor" class="input textarea" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="assets/js/form-engine.js"></script>
  <script src="assets/js/admin-app.js"></script>
</body>
</html>
