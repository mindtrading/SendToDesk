<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 103" role="img" aria-label="CorePanel">
  <title>CorePanel</title>
  <!-- Transparent background — orange mark + CorePanel wordmark -->
  <g transform="translate(8, 14)">
    <!-- Icon: solid circle + open C ring -->
    <circle cx="37" cy="37" r="16" fill="#ff4500"/>
    <path
      d="M58.5 18.2
         A37 37 0 1 0 58.5 55.8
         A26 26 0 1 1 58.5 18.2
         Z"
      fill="#ff4500"
    />
    <!-- Inner ring accent -->
    <path
      d="M54 24.5
         A20.5 20.5 0 1 0 54 49.5"
      fill="none"
      stroke="#ff4500"
      stroke-width="3.2"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>

  <!-- Wordmark: serif initials in orange, body in near-black for light UI -->
  <text y="66" font-size="42" letter-spacing="-0.8">
    <tspan
      x="96"
      font-family="Georgia, 'Times New Roman', Times, serif"
      font-weight="700"
      fill="#ff4500"
    >C</tspan>
    <tspan
      font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
      font-weight="650"
      fill="#1a1a1a"
    >ore</tspan>
    <tspan
      font-family="Georgia, 'Times New Roman', Times, serif"
      font-weight="700"
      fill="#ff4500"
    >P</tspan>
    <tspan
      font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
      font-weight="650"
      fill="#1a1a1a"
    >anel</tspan>
  </text>
</svg>
