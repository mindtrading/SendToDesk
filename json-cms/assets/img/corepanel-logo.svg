<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="CorePanel">
  <title>CorePanel</title>
  <defs>
    <linearGradient id="cp-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eb8ff"/>
      <stop offset="45%" stop-color="#1a7dff"/>
      <stop offset="100%" stop-color="#0a3d8f"/>
    </linearGradient>
    <linearGradient id="cp-ring-deep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2f6b"/>
      <stop offset="100%" stop-color="#163a7a"/>
    </linearGradient>
    <filter id="cp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Black badge background -->
  <rect width="520" height="160" rx="18" fill="#000000"/>

  <!-- Hexagonal C mark -->
  <g transform="translate(18, 22)" filter="url(#cp-soft)">
    <!-- Outer hexagon frame (C opening on the right) -->
    <path
      d="M78 8
         L118 30
         L118 52
         L104 60
         L104 78
         L118 86
         L118 108
         L78 130
         L38 108
         L38 30
         Z"
      fill="url(#cp-ring-deep)"
      opacity="0.95"
    />
    <path
      d="M78 14
         L112 33
         L112 50
         L96 58
         L96 80
         L112 88
         L112 105
         L78 124
         L44 105
         L44 33
         Z"
      fill="url(#cp-ring)"
    />
    <!-- Inner cut to form C -->
    <path
      d="M78 36
         L96 46
         L96 92
         L78 102
         L60 92
         L60 46
         Z"
      fill="#000000"
    />
    <!-- Highlight rim -->
    <path
      d="M78 14 L112 33 L112 50 L96 58"
      fill="none"
      stroke="#8fd0ff"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.55"
    />
    <path
      d="M96 80 L112 88 L112 105 L78 124 L44 105 L44 33 L78 14"
      fill="none"
      stroke="#062048"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.45"
    />

    <!-- 2x2 app tiles -->
    <g transform="translate(66, 48)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#3b9eff"/>
      <rect x="22" y="0" width="18" height="18" rx="4" fill="#ff9a1a"/>
      <rect x="0" y="22" width="18" height="18" rx="4" fill="#22c55e"/>
      <rect x="22" y="22" width="18" height="18" rx="4" fill="#a855f7"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="168"
    y="98"
    font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="54"
    font-weight="750"
    letter-spacing="-1.2"
  >
    <tspan fill="#0b1f3a">Core</tspan><tspan fill="#1a6fff">Panel</tspan>
  </text>
</svg>
